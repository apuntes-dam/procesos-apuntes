site_name: Procesos y planificación de la CPU · Apuntes
site_description: "Apuntes y ejercicios de procesos y planificación de la CPU: estados, FCFS, SJF, prioridad, HRN, Round Robin y SRT, con simulador, y cómo crear y controlar procesos desde el código."
site_url: https://apuntes-dam.github.io/procesos-apuntes/
repo_url: https://github.com/apuntes-dam/procesos-apuntes
repo_name: GitHub
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/extra.css
  - assets/lenguajes.css?v=e142d27e
  - assets/narrador.css
extra_javascript:
  - assets/simulador.js
  - assets/narrador.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Inicio: index.md
  - "U1 · Procesos":
      - u01/index.md
      - "1.1 Qué es un proceso": u01/01-proceso.md
      - "1.2 Estados y transiciones": u01/02-estados.md
      - "1.3 Planificador, despachador y sincronización": u01/03-planificador.md
      - "1.4 Hilos, servicios y procesos huérfanos o zombis": u01/04-hilos-servicios.md
      - "1.5 Concurrencia, paralelismo y distribución": u01/05-concurrencia.md
      - "P1 Ejercicios": u01/ejercicios.md
  - "U2 · Planificación de la CPU":
      - u02/index.md
      - "2.1 Cómo se calcula": u02/01-calculos.md
      - "2.2 No apropiativos": u02/02-no-apropiativos.md
      - "2.3 Apropiativos": u02/03-apropiativos.md
      - "2.4 Comparar los algoritmos": u02/04-comparar.md
      - "2.5 Simulador": u02/05-simulador.md
      - "P2 Ejercicios": u02/ejercicios.md
  - "U3 · Procesos desde el código":
      - u03/index.md
      - "3.1 Tu propio proceso": u03/01-tu-proceso.md
      - "3.2 Lanzar otro programa y esperar": u03/02-lanzar-esperar.md
      - "3.3 Un programa tuyo como hijo: -cp": u03/03-tu-hijo.md
      - "3.4 Argumentos y código de salida": u03/04-argumentos-codigo.md
      - "3.5 Errores típicos al empezar": u03/05-errores.md
      - "P3 Ejercicios": u03/ejercicios.md
  - Simulador de examen: simulador-examen.md
  - Chuleta: chuleta.md
